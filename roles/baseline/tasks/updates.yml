---
- name: Enable periodic unattended upgrades
  ansible.builtin.template:
    src: 20auto-upgrades.j2
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    owner: root
    group: root
    mode: "0644"

- name: Configure unattended-upgrades policy
  ansible.builtin.template:
    src: 52baseline-unattended-upgrades.j2
    dest: /etc/apt/apt.conf.d/52baseline-unattended-upgrades
    owner: root
    group: root
    mode: "0644"
